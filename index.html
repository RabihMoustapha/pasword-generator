<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Password Generator</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
</head>

<body>
    <!-- Main content -->
    <div class="main">
        <h1>Generate a <br><span style="color: rgb(6, 214, 160)">random password</span></h1>
        <p style="color: rgb(233, 236, 239)">Never use an insecure password again</p>
    </div>

    <!-- Button to generate a random password -->
    <button onclick="generate_password()">Generate Password</button>

    <!-- Container for the generated password -->
    <div class="container">
        <p id="generated-password"></p>
    </div>
    <!-- Scripts -->
    <script src="scripts.js"></script>
</body>

</html>
